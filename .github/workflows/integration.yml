name: Bygdok Eternal Integration

on:
  pull_request:
    paths:
      - "android/**"
      - "runtime/**"
      - "modules/**"
      - "configs/**"
      - "*.sh"
      - "scripts/build-server-runtime.sh"
      - ".github/workflows/android.yml"
      - ".github/workflows/server-runtime.yml"
      - ".github/workflows/integration.yml"
  workflow_dispatch:

jobs:
  android:
    uses: ./.github/workflows/android.yml
    secrets: inherit

  # server-runtime is no longer a separate parallel job here: android.yml
  # now depends on it directly so the APK always embeds a matching runtime.